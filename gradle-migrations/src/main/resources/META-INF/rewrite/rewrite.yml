type: specs.openrewrite.org/v1beta/recipe
name: org.gradle.migration.Gradle9to10
displayName: "Gradle 9.5 → 10 migration"
description: "Migrates eager property usage to the lazy Property API. Children are built dynamically from src/main/resources/migration-data.json."
recipeList:
  - org.gradle.migration.MigrationCompositeRecipe:
      target: org.gradle.migration.JavaConvertToLazyProperty
  - org.gradle.migration.MigrationCompositeRecipe:
      target: org.gradle.migration.KotlinAddOperatorImports
  - org.gradle.migration.MigrationCompositeRecipe:
      target: org.gradle.migration.JavaFromLazyToEagerPropertyAssignment
  - org.gradle.migration.GroovyAddAssignment
